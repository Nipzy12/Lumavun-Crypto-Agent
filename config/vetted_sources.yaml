# ---------------------------------------------------------------------------
# Policy applied to every outbound request.
# ---------------------------------------------------------------------------
source_policy:
  # Identifying User-Agent. Override with LUMAVUN_USER_AGENT if needed.
  user_agent: "LUMAVUN-Crypto-Agent/1.3 (+https://github.com/Nipzy12/Lumavun-Crypto-Agent)"
  # Honor robots.txt for each host before requesting a source path.
  respect_robots: true
  # Minimum seconds between two requests to the same host.
  min_interval_seconds: 1.5
  # Per-source request timeout in seconds.
  request_timeout_seconds: 20
  # Maximum entries read from a single source per run.
  max_entries_per_source: 15
  # Maximum campaigns in the final report per run.
  max_findings: 20

# Keywords used to decide whether a source entry is a campaign candidate.
# Matching is case-insensitive and only uses the payload the provider
# published. No scraping beyond the feed/API payload occurs.
discovery:
  campaign_keywords:
    - airdrop
    - testnet
    - devnet
    - quest
    - reward
    - incentive
    - faucet
    - points

  # Terms that suggest the entry describes a concrete campaign rather than
  # pure speculation or announcement noise. Presence of these terms does not
  # guarantee legitimacy; it only tunes extraction.
  confirmation_signals:
    - campaign
    - confirmed
    - announcement
    - eligible
    - window
    - snapshot
    - distribution
    - claimed
    - claim
    - genesis

  # Terms that suggest speculation, rumor, or unverified chatter. When any
  # of these appear, the agent will not describe the entry as confirmed.
  speculation_signals:
    - rumored
    - rumour
    - rumor
    - leak
    - maybe
    - potential
    - not confirmed
    - expected to
    - speculat
    - proposes
    - proposed
    - plans to
    - preliminary
    - reportedly

# ---------------------------------------------------------------------------
# Opportunity classification (V1.3).
#
# These categories describe what kind of opportunity an entry is. They are
# derived from the words the source published, never from assumptions.
# A POINTS_PROGRAM is never described as a guaranteed token reward.
# ---------------------------------------------------------------------------
opportunity:
  # Checked in this order; the first match wins.
  priority:
    - CONFIRMED_AIRDROP
    - POINTS_PROGRAM
    - TESTNET_POTENTIAL
    - FREE_QUEST
  signals:
    CONFIRMED_AIRDROP:
      - airdrop
      - token distribution
      - genesis
      - snapshot
      - claim live
      - claim is live
      - claim opens
      - airdrop confirmed
    POINTS_PROGRAM:
      - points program
      - points
      - leaderboard
      - season
      - loyalty
      - score
    TESTNET_POTENTIAL:
      - testnet
      - devnet
      - incentivized testnet
      - validator
      - node
      - faucet
    FREE_QUEST:
      - quest
      - quests
      - tasks
      - check-in
      - check in
      - follow
      - join
      - verify
  # Phrases that mean "this is not a confirmed token promise".
  downgrade_phrases:
    - no token
    - not confirmed
    - no announcement
    - unknown
    - tba
    - to be announced
    - may or may not
    - no guarantee

  # Reward-status wording, in decreasing order of strength.
  reward_statements:
    stated:
      - will distribute
      - distribution of
      - allocation of
      - committed to
      - total supply
      - reserved
      - airdrop of
    points_only:
      - points
      - leaderboard
      - score
      - xp
    unspecified:
      - no details
      - not announced
      - to be announced
      - tba
  # If a reward sentence contains these, the reward is speculative.
  speculative_reward_phrases:
    - rumored
    - expected
    - may
    - could
    - potential
    - anticipated
    - speculation

# ---------------------------------------------------------------------------
# Zero-capital filter (V1.3).
#
# The agent prioritises opportunities that need no deposit, no purchase and
# no paid gas transaction. It never recommends depositing money to unlock a
# reward, and it reports unknown costs instead of assuming they are zero.
# ---------------------------------------------------------------------------
zero_capital:
  # Hard blockers: if any of these appear, the campaign is not zero-capital.
  blockers:
    - deposit required
    - minimum deposit
    - make a deposit
    - send funds
    - send usd
    - send sol
    - send eth
    - fund your wallet
    - pay to claim
    - pay-to-claim
    - entry fee
    - participation fee
    - purchase tokens
    - buy tokens
    - presale
    - must hold
    - staking required
    - gas fee required
    - you pay gas
  # Negations that flip a blocker match back to allowed when they appear in
  # the same sentence shortly before the matched phrase.
  negations:
    - "no "
    - "without "
    - "never "
    - "free"
    - "not required"
    - "zero cost"
    - "does not require"
  # Actions that need an on-chain transaction. They are allowed, but the
  # agent flags the gas cost as unknown unless the source states it is free.
  onchain_actions:
    - bridge
    - swap
    - mint
    - stake
    - unstake
    - deploy
    - provide liquidity
    - add liquidity
    - sign a transaction
    - send a transaction
  # Phrases showing the source says gas is free / sponsored.
  free_gas_phrases:
    - gasless
    - no gas
    - gas is free
    - sponsored gas
    - free gas
    - faucet
  # Off-chain actions that cost nothing.
  offchain_actions:
    - follow
    - join
    - connect wallet
    - submit
    - verify
    - complete
    - check-in
    - check in
    - register
    - sign up
    - retweet
    - react
    - discord
    - telegram

# Risk rules. Each rule has a label and a simple text matcher.
# Matchers are case-insensitive substring checks against the extracted
# title + summary text. They are intentionally simple and transparent.
risk_rules:
  - id: deposit_required
    label: "Required deposit or upfront payment"
    patterns:
      - "deposit required"
      - "send funds"
      - "send usd"
      - "send sol"
      - "minimum deposit"
      - "fund your wallet"
      - "pay to claim"

  - id: secret_request
    label: "Seed phrase or private key request"
    patterns:
      - "seed phrase"
      - "private key"
      - "recover your wallet"
      - "enter your phrase"
      - "import wallet"

  - id: guaranteed_profit
    label: "Guaranteed profit claim"
    patterns:
      - "guaranteed profit"
      - "guaranteed return"
      - "guaranteed airdrop"
      - "risk free profit"
      - "guaranteed earnings"

  - id: drain_request
    label: "Wallet-draining transaction request"
    patterns:
      - "approve all"
      - "unlimited approval"
      - "set approval for all"
      - "sign this to receive"
      - "drain"
      - "sweep your"

  - id: suspicious_url
    label: "Suspicious URL or impersonation pattern"
    patterns:
      - "bit.ly"
      - "tinyurl"
      - "short.link"
      - "discord.gg"  # context-dependent; informational flag
      - "t.me"        # context-dependent; informational flag

  - id: unknown_project
    label: "Unknown or unverifiable project identity"
    patterns: []
    note: >
      Applied when project identity cannot be reliably extracted from the
      source entry. Informational rather than a keyword match.

  - id: unverifiable_reward
    label: "Unverifiable reward promise"
    patterns:
      - "free money"
      - "free tokens"
      - "instant cash"
      - "guaranteed tokens"

  - id: impersonation
    label: "Possible impersonation or misleading branding"
    patterns:
      - "officially"
      - "verified airdrop"
      - "only official"

# Risk scoring. Scores are transparent heuristic indicators, not security
# guarantees. Each hit contributes its weight; the total is capped.
risk_scoring:
  cap: 100
  bands:
    low_max: 20
    medium_max: 50
  weights:
    secret_request: 45
    drain_request: 40
    deposit_required: 30
    guaranteed_profit: 25
    domain_mismatch: 20
    suspicious_url: 15
    impersonation: 12
    unverifiable_reward: 10
    unknown_project: 8
    reward_claimed_but_unverified: 6

# Risk classification thresholds. These are simple, transparent rules.
classification:
  # HIGH_RISK_INDICATORS: one or more high-severity red flags present.
  high_risk_indicator_ids:
    - deposit_required
    - secret_request
    - guaranteed_profit
    - impersonation
    - drain_request

  # Rules that count as moderate rather than high severity.
  moderate_indicator_ids:
    - suspicious_url
    - unknown_project
    - unverifiable_reward
    - domain_mismatch

# RPC configuration reference.
rpc:
  default_url: "https://api.mainnet-beta.solana.com"
  health_timeout_seconds: 10
  health_method: "getHealth"

# Dedup state retention.
dedup:
  max_entries: 200
  stale_days: 7
