# LUMAVUN Crypto Agent V1.3 — vetted sources configuration
#
# This file is the source registry and rule reference for the agent.
# Every enabled source below was requested over HTTPS during V1.3
# development and returned HTTP 200 with a parseable body. Nothing here is
# guessed, and nothing is invented: the agent only ever reports campaigns
# that appear in the payloads it actually received.
#
# Compliance notes:
#   * Only public, read-only feeds and documented public APIs are used.
#   * robots.txt is fetched and honored before any source request
#     (source_policy.respect_robots).
#   * Requests are rate-limited per host (source_policy.min_interval_seconds)
#     and carry an identifying User-Agent.
#   * No HTML scraping, no login, no account automation, no CAPTCHA bypass.
#   * API keys are never required by the sources configured here.

version: "1.3"

# Backward-compatible feed list. These are the three feeds carried since
# V1.1/V1.2 and they are preserved for compatibility (and used when
# AIRDROP_RSS_FEEDS is not set). The full v1.3 registry is `sources` below,
# where each entry declares its transport (`kind`) and role (`category`).
default_feeds:
  - https://airdropalert.com/feed/rssfeed
  - https://airdrops.io/feed/
  - https://decrypt.co/feed

# ---------------------------------------------------------------------------
# Source registry (V1.3). Each entry is one place the agent may read.
#
#   kind: rss  -> RSS/Atom feed parsed with feedparser
#   kind: json -> documented public JSON API
#   parser:     which adapter turns the payload into campaign candidates
#   category:
#     airdrop_listing -> third-party listing of campaigns
#     official_project -> first-party project announcement channel
#     news -> general crypto newsroom
# ---------------------------------------------------------------------------
sources:
  - id: airdropalert-rss
    label: "AirdropAlert — campaign listing feed (RSS)"
    url: "https://airdropalert.com/feed/rssfeed"
    kind: rss
    parser: feed
    category: airdrop_listing
    official: false
    enabled: true
    notes: >
      Dedicated campaign feed. Entries also carry non-standard fields
      (airdrop_link, website_link, white_paper_link, post-id) which the
      agent reads when present. Referral and tracking parameters are
      stripped from every link before it is used or reported.

  - id: airdrops-io-rss
    label: "airdrops.io — guides, points and testnet write-ups (RSS)"
    url: "https://airdrops.io/feed/"
    kind: rss
    parser: feed
    category: airdrop_listing
    official: false
    enabled: true
    notes: >
      Publishes less often than a listings feed, so a quiet period here is
      normal. Long-form entry bodies are used for task and reward extraction.

  - id: airdropalert-api
    label: "AirdropAlert — public WordPress REST API (JSON)"
    url: "https://airdropalert.com/wp-json/wp/v2/posts?per_page=10&_fields=id,date_gmt,link,title,excerpt"
    kind: json
    parser: wp_rest_posts
    category: airdrop_listing
    official: false
    enabled: true
    notes: >
      Same publisher as airdropalert-rss, read through its own public REST
      API instead of a feed. This is the JSON transport path: the adapter
      maps documented fields (id, date_gmt, link, title.rendered,
      excerpt.rendered). It is a mixed blog feed, so most entries are
      filtered out by the campaign keyword rules — that is expected, not a
      failure.

  - id: decrypt-rss
    label: "Decrypt — crypto newsroom (RSS)"
    url: "https://decrypt.co/feed"
    kind: rss
    parser: feed
    category: news
    official: false
    enabled: true
    notes: >
      General newsroom coverage, not airdrop-dedicated. It surfaces token
      generation events and testnet launches but also carries unrelated
      market news, so most entries will not match campaign keywords. Kept
      because it has been part of the agent since V1.1.

  - id: ethereum-blog-rss
    label: "Ethereum Foundation blog — official announcements (RSS)"
    url: "https://blog.ethereum.org/feed.xml"
    kind: rss
    parser: feed
    category: official_project
    official: true
    enabled: true
    notes: >
      First-party announcement channel. At verification time it published
      testnet upgrade announcements, which is exactly the class of
      opportunity this agent looks for. Entries are never treated as
      reward promises.

  - id: arbitrum-blog-rss
    label: "Arbitrum blog — official announcements (RSS)"
    url: "https://blog.arbitrum.io/feed"
    kind: rss
    parser: feed
    category: official_project
    official: true
    enabled: true
    notes: >
      First-party announcement channel. Publishes incentive-programme
      announcements rarely (1 of the newest 15 entries matched campaign
      keywords at verification time), so expect long quiet periods.

