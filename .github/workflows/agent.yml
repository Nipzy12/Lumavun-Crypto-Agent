name: LUMAVUN Crypto Agent V1.5.2
on:
  workflow_dispatch:
    inputs:
      queue_action:
        description: Record a human task decision (never executes the task)
        type: choice
        options: [none, approve, complete, submit_evidence, operation]
        default: none
      quest_id:
        description: Quest ID from the latest report
        required: false
      task_id:
        description: Task ID from the latest report
        required: false
      task_evidence:
        description: Human approval or completion note (no personal data or secrets)
        required: false
      evidence_url:
        description: Official URL for independent revalidation; never submitted facts
        required: false
      expected_revision:
        description: Revision from review_worklist.json for evidence, operator_playbooks.json for operations
        required: false
      review_request_id:
        description: Unique request ID, reuse only for an identical retry
        required: false
      operation:
        description: Explicit human lifecycle decision or grant planning; never executes externally
        type: choice
        options: [ELIGIBLE, READY_FOR_HUMAN, IN_PROGRESS, SUBMITTED, AWAITING_RESULT, WITHDRAWN, CANCELLED, GRANT_PLAN]
        default: ELIGIBLE
      grant_plan:
        description: JSON planning fields only; no private participant information
        required: false
  schedule:
    - cron: '17 1,13 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: lumavun-crypto-agent
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUMAVUN_REQUEST_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test Worker
        run: node worker/test.mjs

      - name: Validate Worker bundle
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci
          npm run check
          npm run integration

      - name: Run tests
        run: python -m pytest tests -v

      # Independent check of every configured endpoint, using the same
      # registry and robots/rate-limit policy as the agent. It is allowed to
      # fail without stopping the scan, but its result is reported in the
      # step summary and uploaded as an artifact, so a dead source is never
      # silently invisible.
      - name: Verify sources
        id: verify
        continue-on-error: true
        run: python scripts/verify_sources.py

      # The dedup state must come from a PREVIOUS run. actions/download-artifact
      # defaults to the current run, which has no state yet, so this uses the
      # GitHub CLI to locate the newest other successful run and pull its
      # dedup_state artifact explicitly.
      - name: Restore dedup state from previous run
        id: dedup_in
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          echo "Current run: $CURRENT_RUN"
          PREV="$(gh run list \
            --repo "$REPO" \
            --workflow agent.yml \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq "[.[].databaseId] | map(select(. != (${CURRENT_RUN} | tonumber))) | .[0] // empty")"

          if [ -z "$PREV" ]; then
            echo "No earlier successful run found. This is the first run; dedup state starts empty."
            echo "state_source=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Restoring dedup_state from run $PREV"
          if gh run download "$PREV" --repo "$REPO" --name dedup_state --dir .; then
            if [ -f dedup_state.json ]; then
              echo "Restored dedup_state.json ($(wc -c < dedup_state.json) bytes) from run $PREV"
              echo "state_source=run:$PREV" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Artifact from run $PREV contained no dedup_state.json"
              echo "state_source=run:$PREV-empty" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Could not download dedup_state from run $PREV; starting empty."
            echo "state_source=run:$PREV-failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Record human task decision
        if: github.event_name == 'workflow_dispatch' && (inputs.queue_action == 'approve' || inputs.queue_action == 'complete')
        env:
          QUEST_ACTION: ${{ inputs.queue_action }}
          QUEST_ID: ${{ inputs.quest_id }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_EVIDENCE: ${{ inputs.task_evidence }}
        run: python scripts/quest_queue.py "$QUEST_ACTION" --quest "$QUEST_ID" --task "$TASK_ID" --evidence "$TASK_EVIDENCE"

      - name: Import official evidence request
        if: github.event_name == 'workflow_dispatch' && inputs.queue_action == 'submit_evidence'
        env:
          LUMAVUN_STATE_SOURCE: ${{ steps.dedup_in.outputs.state_source }}
          QUEST_ID: ${{ inputs.quest_id }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          REVIEW_REQUEST_ID: ${{ inputs.review_request_id || github.run_id }}
          REVIEWER: ${{ github.actor }}
        run: python scripts/import_evidence.py

      - name: Record authorized operator lifecycle decision
        if: github.event_name == 'workflow_dispatch' && inputs.queue_action == 'operation'
        env:
          LUMAVUN_STATE_SOURCE: ${{ steps.dedup_in.outputs.state_source }}
          OPERATOR_AUTHORIZED: 'true'
          QUEST_ID: ${{ inputs.quest_id }}
          OPERATION: ${{ inputs.operation }}
          GRANT_PLAN: ${{ inputs.grant_plan }}
          TASK_EVIDENCE: ${{ inputs.task_evidence }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          REVIEW_REQUEST_ID: ${{ inputs.review_request_id || github.run_id }}
          REVIEWER: ${{ github.actor }}
        run: python scripts/opportunity_ops.py workflow

      - name: Run agent
        id: run
        run: python src/main.py
        env:
          LUMAVUN_STATE_SOURCE: ${{ steps.dedup_in.outputs.state_source }}
          AIRDROP_RSS_FEEDS: ${{ vars.AIRDROP_RSS_FEEDS }}
          PHANTOM_PUBLIC_ADDRESS: ${{ vars.PHANTOM_PUBLIC_ADDRESS }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          SOLANA_RPC_FALLBACK_URLS: ${{ vars.SOLANA_RPC_FALLBACK_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OPERATOR_MODE: ${{ vars.TELEGRAM_OPERATOR_MODE }}
          TELEGRAM_WEBHOOK_VERIFIED: ${{ vars.TELEGRAM_WEBHOOK_VERIFIED }}
          TELEGRAM_OPERATOR_USER_IDS: ${{ vars.TELEGRAM_OPERATOR_USER_IDS }}
          SOLANA_REWARD_RPC_URL: ${{ secrets.SOLANA_REWARD_RPC_URL || vars.SOLANA_REWARD_RPC_URL }}
          GALXE_ACCESS_TOKEN: ${{ secrets.GALXE_ACCESS_TOKEN }}

      - name: Export and publish sanitized operator snapshot
        id: snapshot
        if: steps.run.outcome == 'success'
        continue-on-error: true
        env:
          OPERATOR_WORKER_URL: ${{ vars.OPERATOR_WORKER_URL }}
          OPERATOR_SNAPSHOT_WRITE_TOKEN: ${{ secrets.OPERATOR_SNAPSHOT_WRITE_TOKEN }}
        run: python scripts/export_operator_snapshot.py

      # Reports and state are uploaded even when the agent fails, so a broken
      # run still leaves diagnostics behind.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: latest_report
          path: |
            latest_report.json
            latest_report.md
            opportunity_recovery.json
            source_coverage.json
            review_worklist.json
            operator_playbooks.json
            operator_snapshot.json
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload dedup state
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dedup_state
          path: dedup_state.json
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload source health
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source_health
          path: source_health.json
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Summarize run
        if: always()
        env:
          STATE_SOURCE: ${{ steps.dedup_in.outputs.state_source }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          SNAPSHOT_PUBLICATION: ${{ steps.snapshot.outputs.status }}
          SOURCES_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## LUMAVUN Crypto Agent V1.3", ""]
          lines.append(f"- Dedup state source: `{os.environ.get('STATE_SOURCE') or 'unknown'}`")
          lines.append(f"- Operator snapshot publication: `{os.environ.get('SNAPSHOT_PUBLICATION') or 'not attempted'}`")
          lines.append(f"- Agent step outcome: `{os.environ.get('RUN_OUTCOME') or 'skipped'}`")
          lines.append(f"- Source verification: `{os.environ.get('SOURCES_OUTCOME') or 'skipped'}`")

          report_path = pathlib.Path("latest_report.json")
          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  lines.append(f"- Report could not be parsed: `{type(exc).__name__}`")
              else:
                  source_summary = report.get("source_summary", {})
                  lines.append(
                      f"- Sources reachable: `{source_summary.get('reachable', 0)}/"
                      f"{source_summary.get('total', 0)}`"
                  )
                  lines.append(
                      f"- Campaigns: `{report.get('total_found', 0)}` total, "
                      f"`{report.get('campaign_count', 0)}` reported, "
                      f"`{report.get('duplicates_skipped', 0)}` duplicates skipped"
                  )
                  types = report.get("opportunity_summary", {})
                  if types:
                      rendered = " | ".join(
                          f"{name} {count}" for name, count in types.items() if count
                      )
                      lines.append(f"- Opportunity types: {rendered or 'none'}")
                  zero = report.get("zero_capital_summary", {})
                  lines.append(
                      f"- Zero-capital: `{zero.get('passes', 0)}` pass, "
                      f"`{zero.get('blocked', 0)}` blocked, `{zero.get('unknown', 0)}` unknown"
                  )
                  wallet = report.get("wallet", {})
                  sol = wallet.get("sol_balance")
                  lines.append(
                      "- Wallet SOL: "
                      + ("unavailable" if sol is None else f"{sol:,.6f} SOL")
                  )
                  telegram = report.get("telegram")
                  if telegram:
                      lines.append(
                          f"- Telegram: `{telegram.get('sent_count')}/"
                          f"{telegram.get('messages')}` messages sent"
                      )
          else:
              lines.append("- Report file: not produced")

          lines.append("- Reports artifact: `latest_report`")
          lines.append("- Dedup artifact: `dedup_state`")
          lines.append("- Source health artifact: `source_health`")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))
          PY
