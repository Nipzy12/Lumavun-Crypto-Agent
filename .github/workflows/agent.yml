name: LUMAVUN Crypto Agent V1.3
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,13 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: lumavun-crypto-agent
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUMAVUN_REQUEST_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

      # Independent check of every configured endpoint, using the same
      # registry and robots/rate-limit policy as the agent. It is allowed to
      # fail without stopping the scan, but its result is reported in the
      # step summary and uploaded as an artifact, so a dead source is never
      # silently invisible.
      - name: Verify sources
        id: verify
        continue-on-error: true
        run: python scripts/verify_sources.py

      # The dedup state must come from a PREVIOUS run. actions/download-artifact
      # defaults to the current run, which has no state yet, so this uses the
      # GitHub CLI to locate the newest other successful run and pull its
      # dedup_state artifact explicitly.
      - name: Restore dedup state from previous run
        id: dedup_in
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          echo "Current run: $CURRENT_RUN"
          PREV="$(gh run list \
            --repo "$REPO" \
            --workflow agent.yml \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq "[.[].databaseId] | map(select(. != (${CURRENT_RUN} | tonumber))) | .[0] // empty")"

          if [ -z "$PREV" ]; then
            echo "No earlier successful run found. This is the first run; dedup state starts empty."
            echo "state_source=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Restoring dedup_state from run $PREV"
          if gh run download "$PREV" --repo "$REPO" --name dedup_state --dir .; then
            if [ -f dedup_state.json ]; then
              echo "Restored dedup_state.json ($(wc -c < dedup_state.json) bytes) from run $PREV"
              echo "state_source=run:$PREV" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Artifact from run $PREV contained no dedup_state.json"
              echo "state_source=run:$PREV-empty" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Could not download dedup_state from run $PREV; starting empty."
            echo "state_source=run:$PREV-failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent
        id: run
        run: python src/main.py
        env:
          LUMAVUN_STATE_SOURCE: ${{ steps.dedup_in.outputs.state_source }}
          AIRDROP_RSS_FEEDS: ${{ vars.AIRDROP_RSS_FEEDS }}
          PHANTOM_PUBLIC_ADDRESS: ${{ vars.PHANTOM_PUBLIC_ADDRESS }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          SOLANA_RPC_FALLBACK_URLS: ${{ vars.SOLANA_RPC_FALLBACK_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Reports and state are uploaded even when the agent fails, so a broken
      # run still leaves diagnostics behind.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest_report
          path: |
            latest_report.json
            latest_report.md
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload dedup state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedup_state
          path: dedup_state.json
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Upload source health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source_health
          path: source_health.json
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Summarize run
        if: always()
        env:
          STATE_SOURCE: ${{ steps.dedup_in.outputs.state_source }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          SOURCES_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## LUMAVUN Crypto Agent V1.3", ""]
          lines.append(f"- Dedup state source: `{os.environ.get('STATE_SOURCE') or 'unknown'}`")
          lines.append(f"- Agent step outcome: `{os.environ.get('RUN_OUTCOME') or 'skipped'}`")
          lines.append(f"- Source verification: `{os.environ.get('SOURCES_OUTCOME') or 'skipped'}`")

          report_path = pathlib.Path("latest_report.json")
          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  lines.append(f"- Report could not be parsed: `{type(exc).__name__}`")
              else:
                  source_summary = report.get("source_summary", {})
                  lines.append(
                      f"- Sources reachable: `{source_summary.get('reachable', 0)}/"
                      f"{source_summary.get('total', 0)}`"
                  )
                  lines.append(
                      f"- Campaigns: `{report.get('total_found', 0)}` total, "
                      f"`{report.get('campaign_count', 0)}` reported, "
                      f"`{report.get('duplicates_skipped', 0)}` duplicates skipped"
                  )
                  types = report.get("opportunity_summary", {})
                  if types:
                      rendered = " | ".join(
                          f"{name} {count}" for name, count in types.items() if count
                      )
                      lines.append(f"- Opportunity types: {rendered or 'none'}")
                  zero = report.get("zero_capital_summary", {})
                  lines.append(
                      f"- Zero-capital: `{zero.get('passes', 0)}` pass, "
                      f"`{zero.get('blocked', 0)}` blocked, `{zero.get('unknown', 0)}` unknown"
                  )
                  wallet = report.get("wallet", {})
                  sol = wallet.get("sol_balance")
                  lines.append(
                      "- Wallet SOL: "
                      + ("unavailable" if sol is None else f"{sol:,.6f} SOL")
                  )
                  telegram = report.get("telegram")
                  if telegram:
                      lines.append(
                          f"- Telegram: `{telegram.get('sent_count')}/"
                          f"{telegram.get('messages')}` messages sent"
                      )
          else:
              lines.append("- Report file: not produced")

          lines.append("- Reports artifact: `latest_report`")
          lines.append("- Dedup artifact: `dedup_state`")
          lines.append("- Source health artifact: `source_health`")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))
          PY
